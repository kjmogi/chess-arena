<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c2621">
  <title>체스 아레나</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b58863'/%3E%3Crect x='16' width='16' height='16' fill='%23f0d9b5'/%3E%3Crect y='16' width='16' height='16' fill='%23f0d9b5'/%3E%3Ctext x='16' y='25' font-size='22' text-anchor='middle' fill='%23111'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-bronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b083"/><stop offset=".55" stop-color="#b0652f"/><stop offset="1" stop-color="#5f3013"/></linearGradient>
      <linearGradient id="g-silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f7fb"/><stop offset=".5" stop-color="#aab6c6"/><stop offset="1" stop-color="#5d687a"/></linearGradient>
      <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffefa3"/><stop offset=".5" stop-color="#eab531"/><stop offset="1" stop-color="#97600b"/></linearGradient>
      <linearGradient id="g-platinum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ccfff6"/><stop offset=".5" stop-color="#2fc4b4"/><stop offset="1" stop-color="#0d6c66"/></linearGradient>
      <linearGradient id="g-diamond" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3eeff"/><stop offset=".45" stop-color="#6597ff"/><stop offset="1" stop-color="#8546f5"/></linearGradient>
      <linearGradient id="g-champion" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1a0"/><stop offset=".5" stop-color="#ffbb30"/><stop offset="1" stop-color="#d9482a"/></linearGradient>
      <linearGradient id="g-placement" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa6bd"/><stop offset="1" stop-color="#465169"/></linearGradient>
      <linearGradient id="g-ai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#97ecff"/><stop offset="1" stop-color="#3563f0"/></linearGradient>
    </defs>
  </svg>

  <!-- 로그인 -->
  <section id="scr-login" class="screen center hidden">
    <div class="auth-card">
      <div class="logo"><span class="pc-ico" data-piece="K"></span><span class="pc-ico" data-piece="n"></span></div>
      <h1>체스 아레나</h1>
      <p class="muted">우리 반 체스 랭크 리그</p>
      <form id="login-form" class="form" autocomplete="on">
        <label><span>반 코드</span><input id="login-class" autocapitalize="none" spellcheck="false" placeholder="예: demo" required></label>
        <label><span>아이디</span><input id="login-id" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label><span>비밀번호</span><input id="login-pw" type="password" autocomplete="current-password" required></label>
        <button class="btn primary lg" type="submit">입장하기</button>
        <p class="err" id="login-err"></p>
      </form>
      <button class="btn ghost sm" id="to-signup" type="button">새 반 만들기 (선생님)</button>
      <div class="demo-note">
        <b>데모 모드</b> — 모든 데이터는 이 브라우저에만 저장돼요. 새 탭을 열어 다른 학생으로 로그인하면 실시간 대전을 해 볼 수 있어요.
        <div class="demo-accounts">
          <span class="muted small">빠른 입력 (반 코드 demo · 비밀번호 1234)</span>
          <div class="row wrap">
            <button type="button" class="btn sm" data-fill="demo/teacher">선생님</button>
            <button type="button" class="btn sm" data-fill="demo/kim01">김민준</button>
            <button type="button" class="btn sm" data-fill="demo/lee02">이서연</button>
            <button type="button" class="btn sm" data-fill="demo/park03">박지호</button>
            <button type="button" class="btn sm" data-fill="demo/yoon07">윤서준</button>
          </div>
        </div>
        <button class="btn ghost sm" id="demo-reset" type="button">데모 데이터 초기화</button>
      </div>
    </div>
  </section>

  <!-- 새 반 만들기 -->
  <section id="scr-signup" class="screen center hidden">
    <div class="auth-card">
      <div class="logo"><span class="pc-ico" data-piece="K"></span><span class="pc-ico" data-piece="n"></span></div>
      <h1>새 반 만들기</h1>
      <p class="muted">선생님 관리자 계정과 반을 함께 만들어요.</p>
      <form id="signup-form" class="form" autocomplete="off">
        <label><span>반 이름</span><input name="cname" required placeholder="예: 3학년 2반"></label>
        <label><span>반 코드 <small class="muted">(학생이 로그인할 때 입력)</small></span><input name="code" required autocapitalize="none" spellcheck="false" placeholder="예: 3-2 (영문 소문자·숫자·-)"></label>
        <label><span>선생님 표시 이름</span><input name="tname" required placeholder="예: 김선생님"></label>
        <label><span>관리자 아이디</span><input name="tid" required value="teacher" autocapitalize="none" spellcheck="false"></label>
        <label><span>비밀번호 (4자 이상)</span><input name="pw" type="password" minlength="4" autocomplete="new-password" required></label>
        <label><span>비밀번호 확인</span><input name="pw2" type="password" minlength="4" autocomplete="new-password" required></label>
        <button class="btn primary lg" type="submit">반 만들기</button>
        <p class="err" id="signup-err"></p>
      </form>
      <button class="btn ghost sm" id="to-login" type="button">← 로그인으로</button>
    </div>
  </section>

  <!-- 학생 홈 -->
  <section id="scr-home" class="screen hidden">
    <header class="topbar">
      <div class="brand"><span class="pc-ico" data-piece="K"></span>체스 아레나 <span class="muted small" id="home-class"></span></div>
      <div class="top-me" id="home-me"></div>
      <button class="btn ghost sm" data-act="logout">로그아웃</button>
    </header>
    <div id="home-banner" class="banners"></div>
    <main class="home-grid" id="home-main"></main>
  </section>

  <!-- 대국 -->
  <section id="scr-game" class="screen hidden">
    <header class="topbar">
      <button class="btn ghost sm" id="g-back">← 나가기</button>
      <div class="g-title" id="g-title"></div>
      <button class="btn ghost sm" id="g-flip" title="판 뒤집기">⇅ 뒤집기</button>
    </header>
    <main class="game-body">
      <div class="board-col">
        <div class="pcard" id="pc-top"></div>
        <div class="board-wrap">
          <div id="g-board"></div>
          <div class="board-overlay hidden" id="g-overlay"></div>
        </div>
        <div class="pcard" id="pc-bot"></div>
      </div>
      <aside class="g-side">
        <div class="card g-status" id="g-status"></div>
        <div class="g-controls" id="g-controls"></div>
        <div class="card"><h3>기보</h3><div class="movelist" id="g-moves"></div></div>
      </aside>
    </main>
  </section>

  <!-- 선생님 관리 -->
  <section id="scr-admin" class="screen hidden">
    <header class="topbar admin-top">
      <div class="brand"><span class="pc-ico" data-piece="K"></span>체스 아레나 <span class="pill">관리자</span></div>
      <div id="admin-class" class="admin-class"></div>
      <span class="muted small" id="admin-who"></span>
      <button class="btn ghost sm" data-act="logout">로그아웃</button>
      <nav class="tabs" id="admin-tabs">
        <button data-tab="live">실시간 경기</button>
        <button data-tab="match">매치 배정</button>
        <button data-tab="students">학생 관리</button>
        <button data-tab="ranking">순위표</button>
        <button data-tab="log">경기 기록</button>
        <button data-tab="settings">설정</button>
      </nav>
    </header>
    <main id="admin-main" class="admin-main"></main>
  </section>

  <div id="modal-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>

  <script src="js/chess.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/rating.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
